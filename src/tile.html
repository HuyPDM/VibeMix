<!doctype html>
<!-- Store promo images. Rendered by store-assets/render.mjs at ?size=tile (440x280) or ?size=marquee (1400x560). -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: 'SG'; src: url(fonts/space-grotesk-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: 'Inter'; src: url(fonts/inter-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: 'Inter'; src: url(fonts/inter-latin-600-normal.woff2); font-weight: 600; }
* { margin: 0; box-sizing: border-box; }
html, body { width: var(--w); height: var(--h); overflow: hidden; background: #0a0b0f; }
body { color: #fff; font-family: Inter, sans-serif; position: relative; }
.bg { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 120% at 85% 0%, #5a3d10 0%, #171a21 45%, #0a0b0f 100%); }
.glow { position: absolute; border-radius: 50%; filter: blur(60px); }
.wrap { position: absolute; inset: 0; display: flex; align-items: center; gap: calc(var(--u) * 1.4); padding: 0 calc(var(--u) * 2.2); }
.icon { width: calc(var(--u) * 4.2); height: calc(var(--u) * 4.2); border-radius: calc(var(--u) * 1); box-shadow: 0 10px 40px rgba(245,165,36,.35); flex: none; }
h1 { font: 700 calc(var(--u) * 2.6) / 1 SG, sans-serif; letter-spacing: -0.02em; }
p { margin-top: calc(var(--u) * .6); font: 600 calc(var(--u) * 1.05) / 1.25 Inter; color: #f5a524; }
small { display: block; margin-top: calc(var(--u) * .5); font: 500 calc(var(--u) * .62) Inter; color: #b6bcc6; }
.steps { position: absolute; right: calc(var(--u) * 1.2); top: calc(var(--u) * 1.1); display: grid; grid-template-columns: repeat(8, calc(var(--u)*.42)); gap: calc(var(--u)*.14); }
.steps i { height: calc(var(--u)*.42); border-radius: 3px; }
/* Small tile: tighter type so the name stays on one line. */
.small .wrap { gap: calc(var(--u) * .9); padding: 0 calc(var(--u) * 1.3); }
.small .icon { width: calc(var(--u) * 3.2); height: calc(var(--u) * 3.2); border-radius: calc(var(--u) * .75); }
.small h1 { font-size: calc(var(--u) * 1.75); white-space: nowrap; }
.small small { display: none; }
.small p { font-size: calc(var(--u) * .78); margin-top: calc(var(--u) * .45); }
</style></head><body>
<div class="bg">
  <div class="glow" style="width:60%;height:90%;right:-15%;top:-40%;background:#f5a524;opacity:.25"></div>
  <div class="glow" style="width:50%;height:80%;left:-20%;bottom:-50%;background:#52bfad;opacity:.18"></div>
</div>
<div class="wrap">
  <img class="icon" src="icon-128.png" alt="">
  <div>
    <h1 id="name">Music Box</h1>
    <p>Pick a vibe. Build your beat.</p>
    <small id="sub">72 original loops · 16-step sequencer</small>
  </div>
</div>
<div class="steps" id="steps"></div>
<script>
const q = new URLSearchParams(location.search);
const [w, h] = q.get('size') === 'marquee' ? [1400, 560] : [440, 280];
document.documentElement.style.cssText = `--w:${w}px;--h:${h}px;--u:${h / 11}px`;
if (q.get('name')) document.getElementById('name').textContent = q.get('name');
if (w === 440) document.body.classList.add('small');
const colors = ['#ef7a68', '#a58bf0', '#52bfad', '#f0b44c'];
const pattern = ['x.x.x.x.', 'x..x.x..', 'x...x..x', '.x.x.xx.'];
document.getElementById('steps').innerHTML = w === 440 ? '' : pattern.map((row, r) =>
  [...row].map((c) => `<i style="background:${colors[r]};opacity:${c === 'x' ? 0.95 : 0.18}"></i>`).join('')).join('');
</script>
</body></html>
